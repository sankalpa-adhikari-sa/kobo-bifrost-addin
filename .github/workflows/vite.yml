name: Vite Build

on:
  push:
    tags:
      - 'v*' 
  
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x] 

    steps:
    - uses: actions/checkout@v4 

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4 
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm' 

    - name: Build
      run: |
        npm ci 
        npm run build